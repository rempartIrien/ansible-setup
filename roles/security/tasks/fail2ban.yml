---
- name: Ensure Fail2ban is installed
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Copy fail2ban configuration
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      port = ssh
      filter = sshd
      backend = systemd
      maxretry = 3
      bantime = 3600
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban
